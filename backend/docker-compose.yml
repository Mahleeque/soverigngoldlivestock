services:
  api:
    build: .
    ports:
      - "8081:8081"
    env_file:
      - .env
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - sovereign_gold_mongo:/data/db
    restart: unless-stopped

volumes:
  sovereign_gold_mongo:
