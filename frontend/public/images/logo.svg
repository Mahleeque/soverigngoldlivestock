<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Rich Gold Gradients -->
    <linearGradient id="goldPlate" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB" />
      <stop offset="25%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#EAB308" />
      <stop offset="75%" stop-color="#CA8A04" />
      <stop offset="100%" stop-color="#854D0E" />
    </linearGradient>
    <linearGradient id="goldGleam" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#713F12" />
      <stop offset="50%" stop-color="#FACC15" />
      <stop offset="100%" stop-color="#FEF08A" />
    </linearGradient>
    <linearGradient id="forestDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F291E" />
      <stop offset="50%" stop-color="#144230" />
      <stop offset="100%" stop-color="#091A13" />
    </linearGradient>
    <linearGradient id="emeraldAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#CA8A04" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Shield / Medallion Background -->
  <rect width="500" height="500" rx="110" fill="url(#forestDeep)" />
  
  <!-- Outer Gold Filigree Ring -->
  <rect x="20" y="20" width="460" height="460" rx="94" fill="none" stroke="url(#goldPlate)" stroke-width="4" opacity="0.4" />
  <circle cx="250" cy="250" r="195" fill="none" stroke="url(#goldPlate)" stroke-width="2" stroke-dasharray="6,6" opacity="0.6" />
  <circle cx="250" cy="250" r="185" fill="none" stroke="url(#goldPlate)" stroke-width="3" opacity="0.85" />

  <!-- Sovereign Crown Flourish at Top -->
  <g transform="translate(250, 115) scale(0.9)" filter="url(#goldGlow)">
    <path d="M-45,0 L-25,-22 L0,-8 L25,-22 L45,0 L35,10 L-35,10 Z" fill="url(#goldPlate)" />
    <circle cx="-25" cy="-24" r="4" fill="#FFFBEB" />
    <circle cx="0" cy="-10" r="5" fill="#FFFBEB" />
    <circle cx="25" cy="-24" r="4" fill="#FFFBEB" />
    <circle cx="-45" cy="-2" r="3" fill="#FFFBEB" />
    <circle cx="45" cy="-2" r="3" fill="#FFFBEB" />
  </g>

  <!-- Central Majestic Horned Ram / Bull Crest -->
  <g transform="translate(250, 260) scale(1.1)" filter="url(#goldGlow)">
    <!-- Horn Left -->
    <path d="M-15,-40 C-45,-75 -95,-60 -105,-20 C-112,12 -85,45 -55,38 C-42,35 -40,20 -50,22 C-70,25 -88,5 -80,-15 C-72,-38 -35,-45 -10,-28 Z" fill="url(#goldPlate)" />
    <!-- Horn Right -->
    <path d="M15,-40 C45,-75 95,-60 105,-20 C112,12 85,45 55,38 C42,35 40,20 50,22 C70,25 88,5 80,-15 C72,-38 35,-45 10,-28 Z" fill="url(#goldPlate)" />

    <!-- Head & Brow Shield -->
    <path d="M-38,-28 C-20,-42 20,-42 38,-28 C45,-10 40,20 28,52 C18,78 0,95 0,95 C0,95 -18,78 -28,52 C-40,20 -45,-10 -38,-28 Z" fill="url(#goldGleam)" />
    
    <!-- Facial Features / Inset Plate -->
    <path d="M-22,-18 L22,-18 L16,35 L0,68 L-16,35 Z" fill="url(#forestDeep)" opacity="0.9" />
    
    <!-- Forehead Star Diamond -->
    <polygon points="0,-10 6,0 0,10 -6,0" fill="url(#goldPlate)" />
    
    <!-- Eyes -->
    <ellipse cx="-12" cy="5" rx="3.5" ry="2" fill="#FDE047" transform="rotate(-15 -12 5)" />
    <ellipse cx="12" cy="5" rx="3.5" ry="2" fill="#FDE047" transform="rotate(15 12 5)" />
    
    <!-- Muzzle / Nose Plate -->
    <path d="M-10,48 C-5,44 5,44 10,48 L8,62 C4,66 -4,66 -8,62 Z" fill="url(#goldPlate)" />
  </g>

  <!-- Ribbon / Banner at Bottom -->
  <g transform="translate(250, 400)">
    <!-- Banner Shadow -->
    <path d="M-150,15 L-110,-10 L110,-10 L150,15 L135,28 L110,12 L-110,12 L-135,28 Z" fill="#06120D" opacity="0.7" />
    <!-- Main Banner -->
    <path d="M-130,-12 L130,-12 L115,18 L-115,18 Z" fill="url(#goldPlate)" />
    <!-- Banner Border -->
    <path d="M-130,-12 L130,-12 L115,18 L-115,18 Z" fill="none" stroke="#FFFBEB" stroke-width="1.5" />
    <!-- Sovereign Star Accents -->
    <circle cx="-95" cy="3" r="3" fill="#0F291E" />
    <circle cx="95" cy="3" r="3" fill="#0F291E" />
  </g>
</svg>
